name: Sync ORCID Publications

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install requests
        run: pip install requests

      - name: Fetch ORCID publications
        run: python fetch_publications.py

      - name: Update publications.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONTENT=$(base64 -w 0 publications.json)

          SHA=$(gh api \
            "/repos/${{ github.repository }}/contents/publications.json" \
            --jq '.sha' 2>/dev/null || true)

          if [ -n "$SHA" ]; then
            gh api \
              --method PUT \
              "/repos/${{ github.repository }}/contents/publications.json" \
              -f message="Update ORCID publications" \
              -f content="$CONTENT" \
              -f sha="$SHA" \
              -f branch="main"
          else
            gh api \
              --method PUT \
              "/repos/${{ github.repository }}/contents/publications.json" \
              -f message="Add ORCID publications" \
              -f content="$CONTENT" \
              -f branch="main"
          fi
