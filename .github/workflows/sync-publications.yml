name: Sync ORCID Publications

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install requests
        run: pip install requests

      - name: Test which script is running
        run: |
          pwd
          ls -la
          echo "----- fetch_publications.py -----"
          cat fetch_publications.py
          echo "----- running script -----"
          python fetch_publications.py

      - name: Commit publication data
        run: |
          git config user.name "ORCID Publication Bot"
          git config user.email "actions@github.com"

          git add publications.json

          if git diff --cached --quiet; then
            echo "No changes to publications."
          else
            git commit -m "Update ORCID publications"
            git push
          fi
