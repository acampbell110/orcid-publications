name: Sync ORCID Publications

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch ORCID publications
        env:
          ORCID_CLIENT_ID: ${{ secrets.ORCID_CLIENT_ID }}
          ORCID_CLIENT_SECRET: ${{ secrets.ORCID_CLIENT_SECRET }}
        run: python fetch_publications.py

      - name: Commit updated publications
        run: |
          git config user.name "ORCID Publication Bot"
          git config user.email "actions@github.com"
          git add publications.json
          git diff --cached --quiet || git commit -m "Update ORCID publications"
          git push
